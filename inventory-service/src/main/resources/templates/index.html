<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventory Service - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; padding: 50px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h1 { color: #0056b3; }
        .status { padding: 10px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${serviceName}">Service Name</h1>
        <p class="status" th:text="${status}">Status will load here...</p>
        <p>This is a separate Thymeleaf UI designed specifically for testing this microservice.</p>
        
        <h3>Available Actions:</h3>
        <ul>
            <li><a href="#">View Stock</a></li>
            <li><a href="#">Reserve Inventory</a></li>
        </ul>
    </div>
</body>
</html>
