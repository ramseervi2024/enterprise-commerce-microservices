<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product - Product Service</title>
</head>
<body>
    <h2>Add New Product</h2>
    <form action="/products/add" method="post" th:object="${product}">
        <label>Name:</label>
        <input type="text" th:field="*{name}" required/><br/><br/>
        
        <label>Description:</label>
        <input type="text" th:field="*{description}" required/><br/><br/>
        
        <label>Price:</label>
        <input type="number" step="0.01" th:field="*{price}" required/><br/><br/>
        
        <button type="submit">Save Product</button>
    </form>
    <br/>
    <a href="/products">Back to Catalog</a>
</body>
</html>
